<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logo Comparison</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif;
      padding: 40px;
      background: #0f172a;
      color: white;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      color: #03234b;
    }
    .card-dark {
      background: #031527;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .label {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
      color: #64748b;
    }
    .card-dark .label {
      color: #94a3b8;
    }
    .logo-wrap {
      padding: 16px;
      background: rgba(0,0,0,0.02);
      border-radius: 8px;
      display: inline-block;
    }
    .card-dark .logo-wrap {
      background: rgba(255,255,255,0.04);
    }
  </style>
</head>
<body>
  <h2>Comparison: Font Size 12.5px vs 13.5px vs 14px</h2>
  
  <div class="grid">
    <!-- Option A: 12.5px -->
    <div class="card">
      <div class="label">LIGHT - Font Size 12.5px (Weight 800)</div>
      <div class="logo-wrap">
        <svg viewBox="0 0 320 64" width="235" height="47" fill="none">
          <image href="/logo-icon.png" x="2" y="4" width="56" height="56" preserveAspectRatio="xMidYMid meet" />
          <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="0.3px" fill="#03234B">HOUSING<tspan dx="6" fill="#00AEEF" font-weight="900">365</tspan></text>
          <text x="69" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.4px" fill="#03234B">LEASING &amp; PROPERTY MANAGEMENT</text>
        </svg>
      </div>
    </div>

    <div class="card-dark">
      <div class="label">DARK - Font Size 12.5px (Cyan #00AEEF / Sky #38BDF8)</div>
      <div class="logo-wrap">
        <svg viewBox="0 0 320 64" width="235" height="47" fill="none">
          <image href="/logo-icon-white.png" x="2" y="4" width="56" height="56" preserveAspectRatio="xMidYMid meet" />
          <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="0.3px" fill="#FFFFFF">HOUSING<tspan dx="6" fill="#00AEEF" font-weight="900">365</tspan></text>
          <text x="69" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.4px" fill="#38BDF8">LEASING &amp; PROPERTY MANAGEMENT</text>
        </svg>
      </div>
    </div>

    <!-- Option B: 13.5px -->
    <div class="card">
      <div class="label">LIGHT - Font Size 13.5px (Extra Bold & Ultra Visible)</div>
      <div class="logo-wrap">
        <svg viewBox="0 0 335 64" width="246" height="47" fill="none">
          <image href="/logo-icon.png" x="2" y="4" width="56" height="56" preserveAspectRatio="xMidYMid meet" />
          <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="0.3px" fill="#03234B">HOUSING<tspan dx="6" fill="#00AEEF" font-weight="900">365</tspan></text>
          <text x="69" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" letter-spacing="0.3px" fill="#03234B">LEASING &amp; PROPERTY MANAGEMENT</text>
        </svg>
      </div>
    </div>

    <div class="card-dark">
      <div class="label">DARK - Font Size 13.5px (Sky #38BDF8, Extra Visible)</div>
      <div class="logo-wrap">
        <svg viewBox="0 0 335 64" width="246" height="47" fill="none">
          <image href="/logo-icon-white.png" x="2" y="4" width="56" height="56" preserveAspectRatio="xMidYMid meet" />
          <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="0.3px" fill="#FFFFFF">HOUSING<tspan dx="6" fill="#00AEEF" font-weight="900">365</tspan></text>
          <text x="69" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" letter-spacing="0.3px" fill="#38BDF8">LEASING &amp; PROPERTY MANAGEMENT</text>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
